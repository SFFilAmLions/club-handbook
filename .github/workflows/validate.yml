name: Validate handbook

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material
      - name: Reject published email addresses
        shell: bash
        run: |
          if grep -RInE --include='*.md' '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' docs; then
            echo "Public handbook pages must not contain full email addresses."
            exit 1
          fi
      - name: Reject square-bracket template placeholders
        shell: bash
        run: |
          if grep -RInE --include='*.md' '\\[[A-Za-z][^]]*\\]' docs | grep -vE '\\[[^]]+\\]\\([^)]*\\)'; then
            echo "Use {Title Case Placeholder} for omitted/template values; reserve square brackets for Markdown links."
            exit 1
          fi
      - run: mkdocs build --strict
