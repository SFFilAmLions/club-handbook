site_name: San Francisco Fil-Am Lions Club Handbook
site_description: Operating procedures for the San Francisco Fil-Am Lions Club
repo_name: SFFilAmLions/club-handbook
repo_url: https://github.com/SFFilAmLions/club-handbook
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  font:
    text: Alata
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/club-brand.css

extra_javascript:
  - javascripts/diagram-zoom.js

extra:
  handbook_version: !ENV [HANDBOOK_VERSION, '1.0.0']

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: README.md
  - Change History: CHANGELOG.md
  - President:
      - Overview: president/index.md
      - Club Meeting Script: president/club-meeting-procedure.md
      - Meeting Guidance: president/meeting-guidance.md
  - Treasurer:
      - Overview: treasurer/index.md
      - Operating Controls: treasurer/operations.md
      - Invoices: treasurer/invoices-and-dues.md
      - Monthly Dues Summary: treasurer/dues-summary.md
      - Payments and Forwarding: treasurer/payments-and-forwarding.md
      - Reimbursements: treasurer/reimbursements.md
      - Quarterly Check Register Review: treasurer/quarterly-review.md
      - Email Templates: treasurer/email-templates.md
  - Secretary:
      - Overview: secretary/index.md
      - Meeting Lifecycle and Announcements: secretary/meeting-lifecycle.md
      - Meeting Agendas: secretary/agendas.md
      - Meeting Minutes: secretary/minutes.md
  - Marketing:
      - Overview: marketing/index.md
      - Website: marketing/website.md
      - YouTube Meeting Recordings: marketing/youtube.md
  - Service Chair:
      - Overview: service-chair/index.md
