{# Keep the repository source widget and its GitHub statistics behavior. #}
<a href="{{ config.repo_url }}" title="{{ lang.t('source') }}" class="md-source" data-md-component="source">
  <div class="md-source__icon md-icon">
    {% set icon = config.theme.icon.repo or "fontawesome/brands/git-alt" %}
    {% include ".icons/" ~ icon ~ ".svg" %}
  </div>
  <span class="md-source__version" aria-label="Handbook version {{ config.extra.handbook_version }}">v{{ config.extra.handbook_version }}</span>
  <div class="md-source__repository">
    {{ config.repo_name }}
  </div>
</a>
<style>
  .md-source__version {
    flex-shrink: 0;
    margin: 0 .4rem;
    font-size: .65rem;
    font-weight: 700;
    white-space: nowrap;
  }
</style>
